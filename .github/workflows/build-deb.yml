name: Build Helix

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Helix git ref (tag/branch/commit)'
        default: 'master'
        required: false
        type: string
  schedule:
    - cron: '0 6 1 * *'   # Monthly at 06:00 UTC on the 1st

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build_deb: true
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build_deb: true
          - arch: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            build_deb: false

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Helix source
        uses: actions/checkout@v7
        with:
          repository: helix-editor/helix
          ref: ${{ inputs.ref || 'master' }}

      - name: Get version info
        id: version
        run: |
          echo "version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = \"\(.*\)\"/\1/p;}' Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Remove rust-toolchain.toml
        run: rm -f rust-toolchain.toml

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          key: ${{ matrix.target }}

      - name: Fetch tree-sitter grammars
        run: cargo run --package=helix-loader --bin=hx-loader

      - name: Build release binary
        run: cargo build --profile opt --locked --target ${{ matrix.target }}

      - name: Build .deb package
        if: matrix.build_deb
        run: |
          cargo install cargo-deb
          mkdir -p target/release
          cp "target/${{ matrix.target }}/opt/hx" target/release/
          sed -i '/^\[package.metadata.deb\]/a depends = "libc6"' helix-term/Cargo.toml
          cargo deb --no-build
          mkdir -p dist
          for f in target/debian/*.deb; do
            newname="helix_${{ steps.version.outputs.version }}+dev.${{ steps.version.outputs.date }}.${{ steps.version.outputs.sha }}_${{ matrix.arch }}.deb"
            mv "$f" "dist/${newname}"
          done

      - name: Create .tar.gz archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE="${{ steps.version.outputs.date }}"
          SHA="${{ steps.version.outputs.sha }}"
          PKG_NAME="helix_${VERSION}+dev.${DATE}.${SHA}_${{ matrix.arch }}"
          mkdir -p "${PKG_NAME}" dist
          cp "target/${{ matrix.target }}/opt/hx" "${PKG_NAME}/"
          chmod +x "${PKG_NAME}/hx"
          rm -rf runtime/grammars/sources
          cp -r runtime "${PKG_NAME}/"
          cp LICENSE README.md "${PKG_NAME}/"
          mkdir -p "${PKG_NAME}/contrib"
          cp -r contrib/completion "${PKG_NAME}/contrib/"
          tar czf "dist/${PKG_NAME}.tar.gz" "${PKG_NAME}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: dist/*

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true

      - name: Extract version info from artifacts
        id: version
        run: |
          FILE=$(ls helix_* 2>/dev/null | head -1)
          BASE=$(echo "$FILE" | sed -E 's/\.(deb|tar\.gz)$//')
          PART2=$(echo "$BASE" | sed 's/.*+dev\.\(.*\)/\1/')
          echo "version=$(echo "$BASE" | sed 's/helix_\(.*\)+dev\..*/\1/')" >> "$GITHUB_OUTPUT"
          echo "date=$(echo "$PART2" | cut -d'.' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$PART2" | cut -d'.' -f2 | sed 's/_.*$//')" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha }}
          name: Helix ${{ steps.version.outputs.version }}+dev (${{ steps.version.outputs.date }})
          body: |
            Auto-built from [helix-editor/helix](https://github.com/helix-editor/helix) @ master.
            Triggered by: ${{ github.event_name }}
          files: |
            *.deb
            *.tar.gz
          draft: false
          prerelease: true
          make_latest: false
